<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="box">
        <div class="logo">
            <div class="img"></div>
            <h2>Welcome Back</h2>
        </div>
        <div class="login">
            <!-- Username -->
            <div class="field">
                <input id="uname" type="text" required />
                <label class="label" for="uname">Username</label>
            </div>

            <div>
                <div class="field">
                    <input type="checkbox" id="eyeToggle" hidden>
                    <label for="eyeToggle" class="eye"></label>
                    <input id="password" type="password" required />
                    <label class="label" for="password">Password</label>
                </div>

                <div class="options">
                    <label>
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#">Forgot Password</a>
                </div>
            </div>
            <button class="btn">Sign In</button>

            <div class="orbox">
                <div class="ortext">or</div>
                <hr class="or">
            </div>

            <button class="google">
                <div class="icon"></div>
                <div class="text">Sign in with Google</div>
            </button>
        </div>
        <div class="bottom">
            <p class="signup">
                Don't have an account? <a href="#">Sign Up</a>
            </p>
        </div>
    </div>
    <div class="bg"></div>
</body>

</html>
