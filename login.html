<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --card: #ffffff;
            --accent: #2563eb;
            --muted: #6b7280;
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%
        }

        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, var(--bg), #e9eef8);
            font-family: Inter, system-ui, Segoe UI, Arial, sans-serif;
            color: #111827;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 28px;
        }

        .card {
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 6px 24px rgba(16, 24, 40, 0.08);
            padding: 28px;
            border: 1px solid rgba(15, 23, 42, 0.04);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        p.lead {
            margin: 0 0 20px;
            color: var(--muted);
            font-size: 14px;
        }

        form {
            display: grid;
            gap: 12px
        }

        label {
            font-size: 13px;
            margin-bottom: 6px;
            display: block;
            color: #374151;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 12px;
            border-radius: 8px;
            border: 1px solid #e6e9ef;
            background: #fff;
            font-size: 14px;
            outline: none;
            transition: box-shadow .12s, border-color .12s;
        }

        input:focus {
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08);
            border-color: var(--accent)
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between
        }

        .actions {
            display: flex;
            gap: 8px;
            align-items: center
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--muted)
        }

        button[type="submit"] {
            background: var(--accent);
            color: #fff;
            border: 0;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        .ghost {
            background: transparent;
            color: var(--accent);
            border: 1px solid rgba(37, 99, 235, 0.12)
        }

        .links {
            font-size: 13px;
            color: var(--muted)
        }

        .forgot {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500
        }

        .hint {
            font-size: 12px;
            color: var(--muted);
            margin-top: 6px;
            text-align: center
        }

        @media (max-width:420px) {
            .container {
                padding: 18px
            }

            .card {
                padding: 20px
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card" role="main" aria-labelledby="pageTitle">
            <h1 id="pageTitle">Sign in to your account</h1>
            <p class="lead">Enter your credentials to access your dashboard.</p>

            <form id="loginForm" autocomplete="on" novalidate>
                <div>
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" placeholder="you@example.com" required>
                </div>

                <div>
                    <label for="password">Password</label>
                    <div style="position:relative;">
                        <input id="password" name="password" type="password" placeholder="••••••••" required
                            aria-describedby="togglePwd">
                        <button type="button" id="togglePwd" title="Show password"
                            style="position:absolute;right:6px;top:6px;padding:6px;border-radius:6px;border:0;background:transparent;cursor:pointer;color:var(--muted)">Show</button>
                    </div>
                </div>

                <div class="row">
                    <label class="checkbox"><input type="checkbox" name="remember"> Remember me</label>
                    <a class="forgot" href="#" onclick="event.preventDefault()">Forgot?</a>
                </div>

                <div style="display:flex;gap:8px;margin-top:6px">
                    <button type="submit">Sign in</button>
                    <button type="button" class="ghost"
                        onclick="document.getElementById('loginForm').reset()">Reset</button>
                </div>

                <p class="hint">Don't have an account? <a href="#" onclick="event.preventDefault()">Sign up</a></p>
            </form>
        </div>
    </div>

    <script>
        // Small UX: toggle password visibility and simple validation placeholder
        (function () {
            const pwd = document.getElementById('password');
            const btn = document.getElementById('togglePwd');
            btn.addEventListener('click', function () {
                const isPwd = pwd.type === 'password';
                pwd.type = isPwd ? 'text' : 'password';
                btn.textContent = isPwd ? 'Hide' : 'Show';
                btn.title = isPwd ? 'Hide password' : 'Show password';
            });

            const form = document.getElementById('loginForm');
            form.addEventListener('submit', function (e) {
                if (!form.checkValidity()) {
                    e.preventDefault();
                    form.reportValidity();
                    return;
                }
                e.preventDefault();
                // Replace this with real submit logic
                alert('Submitted: ' + document.getElementById('email').value);
            });
        })();
    </script>
</body>

</html>
